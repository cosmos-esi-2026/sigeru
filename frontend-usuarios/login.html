<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - SiGeRU</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="pantalla-centrada">
    <div class="tarjeta-auth">
      <h1>SiGeRU</h1>
      <p class="subtitulo">Ingresá con tu cuenta para acceder al panel</p>

      <form id="form-login" class="formulario">
        <label>Email
          <input type="email" name="email" value="admin@sigeru.uy"
                 autocomplete="email" required>
        </label>
        <label>Contraseña
          <input type="password" name="password" value="123456"
                 autocomplete="current-password" required>
        </label>
        <button type="submit" class="boton boton-primario">Ingresar</button>
      </form>

      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

      <p class="texto-centro mt">¿No tenés cuenta? <a href="registro.html">Solicitá acceso</a></p>
      <p class="texto-centro mt"><a href="../landing/index.html">Volver al inicio</a></p>

      <div class="banda" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/formularios.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
