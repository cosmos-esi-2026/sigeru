<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenedores - SiGeRU</title>
  <link rel="icon" href="img/logo.svg">
  <meta name="theme-color" content="#115440">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tema.js"></script>
</head>
<body>

<a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>

<div class="layout">

  <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>

  <div class="principal">

    <header class="topbar">
      <div class="topbar-titulo">
        <h1>Contenedores</h1>
        <p class="bajada">Ubicación, capacidad y estado de los contenedores de la ciudad.</p>
      </div>
      <button class="boton boton-primario solo-admin" id="btn-nuevo" data-bs-toggle="modal" data-bs-target="#modal-contenedor">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nuevo contenedor
      </button>
    </header>

    <main class="contenido" id="contenido-principal">
      <section class="panel" aria-labelledby="titulo-listado">

        <div class="barra-herramientas">
          <h2 class="titulo" id="titulo-listado">Listado</h2>

          <div class="buscador-caja">
            <label class="solo-lectores" for="buscar">Buscar contenedores</label>
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="search" class="buscador" id="buscar" maxlength="60"
                   placeholder="Código, dirección, zona o tipo">
          </div>

          <button class="boton boton-icono" id="btn-recargar" aria-label="Recargar el listado">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/>
            </svg>
          </button>
        </div>

        <form class="filtros" id="form-filtros" data-chips aria-label="Filtrar contenedores">
          <label>Estado
            <select name="estado">
              <option value="">Todos</option>
              <option value="disponible">Disponible</option>
              <option value="lleno">Lleno</option>
              <option value="mantenimiento">En mantenimiento</option>
              <option value="retirado">Retirado</option>
            </select>
          </label>
          <label>Zona
            <select name="zona"><option value="">Todas</option></select>
          </label>
          <label>Tipo de residuo
            <select name="tipo"><option value="">Todos</option></select>
          </label>
          <div class="filtros-acciones">
            <button type="reset" class="boton boton-secundario boton-chico">Limpiar</button>
          </div>
        </form>

        <p id="mensaje-pagina" class="mensaje" role="status" aria-live="polite"></p>

        <div class="tabla-scroll">
          <table class="tabla" id="tabla-contenedores" role="table">
            <thead role="rowgroup">
              <tr role="row">
                <th role="columnheader" data-orden>Código</th>
                <th role="columnheader" data-orden>Dirección</th>
                <th role="columnheader" data-orden>Zona</th>
                <th role="columnheader" data-orden>Capacidad</th>
                <th role="columnheader" data-orden>Tipo</th>
                <th role="columnheader" data-orden>Estado</th>
                <th role="columnheader" class="solo-admin"><span class="solo-lectores">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla" role="rowgroup">
              <tr class="fila-esqueleto" aria-hidden="true">
                <td><span class="esqueleto esqueleto-corto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto esqueleto-corto"></span></td>
              </tr>
            </tbody>
          </table>
        </div>

        <nav class="paginacion" id="paginacion" aria-label="Paginación de contenedores"></nav>

      </section>
    </main>
  </div>
</div>

<div class="modal fade" id="modal-contenedor" tabindex="-1" aria-labelledby="titulo-modal-contenedor" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title" id="titulo-modal-contenedor">Nuevo contenedor</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <form id="form-contenedor" class="formulario">
          <label>Código
            <input type="text" name="codigo" placeholder="CNT-004" required>
          </label>
          <label>Dirección
            <input type="text" name="direccion" placeholder="Av. Italia 2734" required>
          </label>
          <div class="formulario-columnas">
            <label>Capacidad (litros)
              <input type="text" name="capacidad" inputmode="numeric" pattern="[0-9]+" maxlength="6" placeholder="1100">
            </label>

            <label>Tipo de residuo
              <select name="tipo_residuo"></select>
            </label>
          </div>
          <div class="formulario-columnas">
            <label>Zona
              <select name="id_zona"></select>
            </label>
            <label>Estado
              <select name="estado">
                <option value="disponible">Disponible</option>
                <option value="lleno">Lleno</option>
                <option value="mantenimiento">En mantenimiento</option>
                <option value="retirado">Retirado</option>
              </select>
            </label>
          </div>
          <button type="submit" class="boton boton-primario">Guardar contenedor</button>
        </form>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </div>

    </div>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/formularios.js"></script>
<script src="js/shell.js"></script>
<script src="js/tabla.js"></script>
<script src="js/lista.js"></script>
<script src="js/contenedores.js"></script>
</body>
</html>
