<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGeRU - Contenedores</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <span class="marca">SiGeRU</span>
    <div class="links">
      <a href="dashboard.html">Inicio</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="contenedores.html">Contenedores</a>
      <a href="camiones.html">Camiones</a>
      <a href="#" id="btn-salir">Cerrar sesion</a>
    </div>
  </nav>

  <div class="contenido">

    <div class="caja">
      <h2>Nuevo contenedor</h2>
      <form id="form-contenedor" class="formulario">
        <label>Codigo
          <input type="text" name="codigo" placeholder="CNT-004" required>
        </label>
        <label>Direccion
          <input type="text" name="direccion" required>
        </label>
        <label>Capacidad (litros)
          <input type="number" name="capacidad" min="0">
        </label>
        <label>Tipo de residuo
          <select name="tipo_residuo">
            <option>Organico</option>
            <option>Plastico</option>
            <option>Vidrio</option>
            <option>Papel</option>
            <option>Metal</option>
          </select>
        </label>
        <label>Estado
          <select name="estado">
            <option value="disponible">disponible</option>
            <option value="lleno">lleno</option>
            <option value="mantenimiento">mantenimiento</option>
            <option value="retirado">retirado</option>
          </select>
        </label>
        <button type="submit" class="boton boton-primario">Guardar</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </div>

    <div class="caja">
      <div class="fila-titulo">
        <h2>Contenedores</h2>
        <button class="boton boton-primario boton-pequeno" id="btn-recargar">Recargar</button>
      </div>
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th><th>Codigo</th><th>Direccion</th>
            <th>Capacidad</th><th>Tipo</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla">
          <tr><td colspan="6">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/contenedores.js"></script>
</body>
</html>
