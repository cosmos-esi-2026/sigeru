<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===================== Barra lateral ===================== -->

    <a class="sidebar-marca" href="dashboard.html">
      <img src="img/logo.svg" alt="">
      SiGeRU
    </a>
    <div class="banda" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

    <nav class="sidebar-nav" aria-label="Secciones del sistema">
      <a class="sidebar-link" href="dashboard.html">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H4a1 1 0 0 1-1-1z"/>
        </svg>
        Inicio
      </a>
      <a class="sidebar-link" href="usuarios.html">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="3.2"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/>
          <path d="M16.5 5.3a3.2 3.2 0 0 1 0 5.4"/><path d="M17.8 14.4A6.2 6.2 0 0 1 21.2 20"/>
        </svg>
        Usuarios
      </a>
      <a class="sidebar-link" href="contenedores.html">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/>
          <path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
        Contenedores
      </a>
      <a class="sidebar-link" href="camiones.html">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 6h11v10H2z"/><path d="M13 9.5h4l4 3.5V16h-8z"/>
          <circle cx="7" cy="18.3" r="1.9"/><circle cx="17" cy="18.3" r="1.9"/>
        </svg>
        Camiones
      </a>
      <a class="sidebar-link" href="centros.html">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 5l9 5.5V20H3z"/><path d="M8 20v-6h8v6"/>
        </svg>
        Centros de acopio
      </a>
      <a class="sidebar-link" href="maquinaria.html">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21"/>
          <path d="m5.6 5.6 1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/>
        </svg>
        Maquinaria

      <a class="sidebar-link activo" href="solicitudes.html">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12h5l2 3h4l2-3h5"/><path d="M4 6h16v12H4z"/>
        </svg>
        Solicitudes

    </nav>

    <div class="sidebar-pie">
      <div class="sidebar-usuario">
        <div class="nombre" id="sidebar-nombre"></div>
        <div class="rol" id="sidebar-rol"></div>
      </div>
      <a class="sidebar-link" href="#" id="btn-salir">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/>
          <path d="M10 8l-4 4 4 4"/><path d="M6 12h11"/>
        </svg>
        Cerrar sesión
      </a>
    </div>

  </aside>

  <!-- ===================== Contenido ===================== -->
  <div class="principal">

    <header class="topbar">
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menú">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <div class="topbar-titulo">
        <h1>Solicitudes de acceso</h1>
        <p class="bajada">Pedidos de alta que entraron por el registro público y esperan aprobación.</p>
      </div>
    </header>

    <main class="contenido" id="contenido-principal">
      <section class="panel" aria-labelledby="titulo-listado">

        <div class="barra-herramientas">
          <h2 class="titulo" id="titulo-listado">Listado</h2>

          <label class="filtro-estado">
            <span class="solo-lectores">Filtrar por estado</span>
            <select id="filtro-estado" class="buscador">
              <option value="pendiente">Pendientes</option>
              <option value="">Todas</option>
              <option value="aprobada">Aprobadas</option>
              <option value="rechazada">Rechazadas</option>
            </select>
          </label>

          <div class="buscador-caja">
            <label class="solo-lectores" for="buscador">Buscar solicitudes</label>
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="search" class="buscador" id="buscador"
                   placeholder="Buscar por nombre o email">
          </div>

          <button class="boton boton-icono" id="btn-recargar" aria-label="Recargar el listado">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/>
            </svg>
          </button>
        </div>

        <p id="mensaje-pagina" class="mensaje" role="status" aria-live="polite"></p>
        <p class="contador-resultados" id="contador-resultados" data-sustantivo="solicitudes"></p>

        <div class="tabla-scroll">
          <table class="tabla" id="tabla-solicitudes" role="table">
            <thead role="rowgroup">
              <tr role="row">
                <th role="columnheader" data-orden>Fecha</th>
                <th role="columnheader" data-orden>Nombre</th>
                <th role="columnheader" data-orden>Email</th>
                <th role="columnheader" data-orden>Teléfono</th>
                <th role="columnheader" data-orden>Estado</th>
                <th role="columnheader"><span class="solo-lectores">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla" role="rowgroup">
              <tr class="fila-esqueleto" aria-hidden="true">
                <td><span class="esqueleto esqueleto-corto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto esqueleto-corto"></span></td>
              </tr>
            </tbody>
          </table>
        </div>

      </section>
    </main>
  </div>
</div>

<!-- ===================== Modal de aprobación ===================== -->
<!-- Aprobar no es solo decir que sí: hay que decidir con qué rol entra la
     persona. Por eso es un modal con una decisión y no un botón directo. -->
<div class="modal fade" id="modal-aprobar" tabindex="-1" aria-labelledby="titulo-modal-aprobar" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title" id="titulo-modal-aprobar">Aprobar solicitud</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <p class="ayuda" id="detalle-solicitud"></p>

        <form id="form-aprobar" class="formulario">
          <label>Rol con el que entra
            <select name="rol">
              <option value="Vecino">Vecino</option>
              <option value="Operario">Operario</option>
              <option value="Cuadrilla">Cuadrilla</option>
              <option value="Administrador">Administrador</option>
            </select>
          </label>
          <button type="submit" class="boton boton-primario">Aprobar y crear la cuenta</button>
        </form>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </div>

    </div>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/formularios.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/tabla.js"></script>
<script src="js/solicitudes.js"></script>
</body>
</html>
