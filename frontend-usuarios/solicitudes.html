<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitudes de acceso - SiGeRU</title>
  <link rel="icon" href="img/logo.svg">
  <meta name="theme-color" content="#115440">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tema.js"></script>
</head>
<body>

<a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>

<div class="layout">

  <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>

  <div class="principal">

    <header class="topbar">
      <div class="topbar-titulo">
        <h1>Solicitudes de acceso</h1>
        <p class="bajada">Solicitudes anteriores al registro directo de vecinos.</p>
      </div>
    </header>

    <main class="contenido" id="contenido-principal">
      <section class="panel" aria-labelledby="titulo-listado">

        <div class="barra-herramientas">
          <h2 class="titulo" id="titulo-listado">Listado</h2>

          <label class="filtro-estado">
            <span class="solo-lectores">Filtrar por estado</span>
            <select id="filtro-estado" class="buscador">
              <option value="pendiente">Pendientes</option>
              <option value="">Todas</option>
              <option value="aprobada">Aprobadas</option>
              <option value="rechazada">Rechazadas</option>
            </select>
          </label>

          <div class="buscador-caja">
            <label class="solo-lectores" for="buscador">Buscar solicitudes</label>
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="search" class="buscador" id="buscador"
                   placeholder="Nombre o email">
          </div>

          <button class="boton boton-icono" id="btn-recargar" aria-label="Recargar el listado">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/>
            </svg>
          </button>
        </div>

        <p id="mensaje-pagina" class="mensaje" role="status" aria-live="polite"></p>
        <p class="contador-resultados" id="contador-resultados" data-sustantivo="solicitudes"></p>

        <div class="tabla-scroll">
          <table class="tabla" id="tabla-solicitudes" role="table">
            <thead role="rowgroup">
              <tr role="row">
                <th role="columnheader" data-orden>Fecha</th>
                <th role="columnheader" data-orden>Nombre</th>
                <th role="columnheader" data-orden>Email</th>
                <th role="columnheader" data-orden>Teléfono</th>
                <th role="columnheader" data-orden>Pide ser</th>
                <th role="columnheader" data-orden>Estado</th>
                <th role="columnheader"><span class="solo-lectores">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla" role="rowgroup">
              <tr class="fila-esqueleto" aria-hidden="true">
                <td><span class="esqueleto esqueleto-corto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto esqueleto-corto"></span></td>
              </tr>
            </tbody>
          </table>
        </div>

      </section>
    </main>
  </div>
</div>

<div class="modal fade" id="modal-aprobar" tabindex="-1" aria-labelledby="titulo-modal-aprobar" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title" id="titulo-modal-aprobar">Aprobar solicitud</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <p class="ayuda" id="detalle-solicitud"></p>

        <form id="form-aprobar" class="formulario">
          <label>Contraseña inicial *
            <input type="password" name="password" autocomplete="new-password" minlength="8" required>
            <span class="ayuda-campo">Al menos 8 caracteres. Entregásela a la persona en mano: no se manda por correo.</span>
          </label>
          <label id="campo-rol">Rol con el que entra
            <select name="rol">
              <option value="Vecino">Vecino</option>
              <option value="Operario">Operario</option>
              <option value="Cuadrilla">Cuadrilla</option>
              <option value="Administrador">Administrador</option>
            </select>
          </label>
          <label id="campo-cuadrilla" class="oculto">Cuadrilla real
            <select name="id_cuadrilla">
              <option value="">Elegí una cuadrilla</option>
            </select>
            <span class="ayuda-campo">Quien pidió acceso como cuadrilla solo puede entrar como Cuadrilla. Elegí la cuadrilla a la que pertenece de verdad: lo que escribió la persona es solo una pista.</span>
          </label>
          <button type="submit" class="boton boton-primario">Aprobar y crear la cuenta</button>
        </form>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </div>

    </div>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/formularios.js"></script>
<script src="js/shell.js"></script>
<script src="js/tabla.js"></script>
<script src="js/solicitudes.js"></script>
</body>
</html>
