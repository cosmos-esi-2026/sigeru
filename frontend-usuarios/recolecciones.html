<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recolecciones - SiGeRU</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>

<div class="layout">

  <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>

  <div class="principal">

    <header class="topbar">
      <div class="topbar-titulo">
        <h1>Recolecciones</h1>
        <p class="bajada">Planificá las salidas de los camiones y seguí cada recorrido con sus vaciados.</p>
      </div>
      <a class="boton boton-secundario" id="btn-sugerir-ruta" href="ruta-sugerida.html">Sugerir ruta</a>
      <button class="boton boton-primario" id="btn-nueva" data-bs-toggle="modal" data-bs-target="#modal-recoleccion">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Planificar recolección
      </button>
    </header>

    <main class="contenido" id="contenido-principal" data-vista="admin">
      <section class="panel" aria-labelledby="titulo-listado">

        <div class="barra-herramientas">
          <h2 class="titulo" id="titulo-listado">Listado</h2>

          <div class="buscador-caja">
            <label class="solo-lectores" for="buscador">Buscar recolecciones</label>
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="search" class="buscador" id="buscador"
                   placeholder="Buscar por número, ruta o camión">
          </div>

          <button class="boton boton-icono" id="btn-recargar" aria-label="Recargar el listado">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/>
            </svg>
          </button>
        </div>

        <form class="filtros" id="form-filtros" aria-label="Filtrar recolecciones">
          <label>Estado
            <select name="estado">
              <option value="pendientes">Pendientes (planificadas y en curso)</option>
              <option value="todas" selected>Todas</option>
              <option value="planificada">Planificada</option>
              <option value="en_curso">En curso</option>
              <option value="finalizada">Finalizada</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </label>
          <label>Desde
            <input type="date" name="desde">
          </label>
          <label>Hasta
            <input type="date" name="hasta">
          </label>
          <div class="filtros-acciones">
            <button type="submit" class="boton boton-secundario boton-chico">Filtrar</button>
            <button type="reset" class="boton boton-secundario boton-chico">Limpiar</button>
          </div>
        </form>

        <p id="mensaje-pagina" class="mensaje" role="status" aria-live="polite"></p>
        <p class="contador-resultados" id="contador-resultados" data-sustantivo="recolecciones" aria-live="polite"></p>

        <div class="tabla-scroll">
          <table class="tabla" id="tabla-recolecciones" role="table">
            <thead role="rowgroup"></thead>
            <tbody id="cuerpo-tabla" role="rowgroup"></tbody>
          </table>
        </div>

      </section>
    </main>
  </div>
</div>

<div class="modal fade" id="modal-recoleccion" tabindex="-1" aria-labelledby="titulo-modal-recoleccion" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title" id="titulo-modal-recoleccion">Planificar una recolección</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <p class="precarga-aviso oculto" id="aviso-precarga" role="status"></p>
        <form id="form-recoleccion" class="formulario">
          <label>Ruta *
            <select name="id_ruta" required></select>
          </label>
          <label>Fecha y hora de inicio *
            <input type="datetime-local" name="fecha_hora_inicio" required>
          </label>
          <p class="ayuda-campo">Al elegir la ruta se propone su próximo día y hora.</p>
          <div class="formulario-columnas">
            <label>Camión *
              <select name="id_camion" required></select>
            </label>
            <label>Cuadrilla *
              <select name="id_cuadrilla" required></select>
            </label>
          </div>
          <label>Centro de acopio de destino
            <select name="id_centro"></select>
          </label>
          <label>Observaciones
            <textarea name="observaciones" rows="2" maxlength="300" placeholder="Opcional"></textarea>
          </label>
          <button type="submit" class="boton boton-primario">Planificar</button>
        </form>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </div>

    </div>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/formularios.js"></script>
<script src="js/shell.js"></script>
<script src="js/tabla.js"></script>
<script src="js/incidencias-comun.js"></script>
<script src="js/recolecciones.js"></script>
<script src="js/planificar-recoleccion.js"></script>
</body>
</html>
