<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGeRU - Usuarios</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <span class="marca">SiGeRU</span>
    <div class="links">
      <a href="dashboard.html">Inicio</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="contenedores.html">Contenedores</a>
      <a href="camiones.html">Camiones</a>
      <a href="#" id="btn-salir">Cerrar sesion</a>
    </div>
  </nav>

  <div class="contenido">

    <div class="caja">
      <h2>Nuevo usuario</h2>
      <form id="form-usuario" class="formulario">
        <label>Nombre
          <input type="text" name="nombre" required>
        </label>
        <label>Apellido
          <input type="text" name="apellido" required>
        </label>
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Rol
          <select name="rol">
            <option>Vecino</option>
            <option>Operario</option>
            <option>Cuadrilla</option>
            <option>Administrador</option>
          </select>
        </label>
        <button type="submit" class="boton boton-primario">Guardar</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </div>

    <div class="caja">
      <div class="fila-titulo">
        <h2>Usuarios registrados</h2>
        <button class="boton boton-primario boton-pequeno" id="btn-recargar">Recargar</button>
      </div>
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th><th>Nombre</th><th>Apellido</th><th>Email</th>
            <th>Rol</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla">
          <tr><td colspan="6">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
