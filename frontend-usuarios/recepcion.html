<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepción - SiGeRU</title>
  <link rel="icon" href="img/logo.svg">
  <meta name="theme-color" content="#115440">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tema.js"></script>
</head>
<body>

<a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>

<div class="layout">

  <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>

  <div class="principal">

    <header class="topbar">
      <div class="topbar-titulo">
        <h1 id="titulo-pagina">Recepción</h1>
        <p class="bajada" id="bajada-pagina">Qué trae la recolección y qué se recibió en el centro.</p>
      </div>
      <a class="boton boton-secundario" href="recepciones.html">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
        Volver a las recepciones
      </a>
    </header>

    <main class="contenido" id="contenido-principal">

      <p id="mensaje-pagina" class="mensaje mensaje-pagina" role="status" aria-live="polite"></p>

      <div class="columnas-detalle columnas-anchas" id="detalle">
        <div class="columna-principal">
          <section class="panel" aria-labelledby="titulo-datos">
            <h2 class="titulo-panel" id="titulo-datos">Datos de la recolección</h2>
            <div id="zona-datos">
              <span class="esqueleto"></span><span class="esqueleto"></span><span class="esqueleto esqueleto-corto"></span>
            </div>
          </section>

          <section class="panel" aria-labelledby="titulo-esperado">
            <h2 class="titulo-panel" id="titulo-esperado">Lo que declararon los vaciados</h2>
            <div class="tabla-scroll">
              <table class="tabla" role="table">
                <thead role="rowgroup">
                  <tr role="row">
                    <th role="columnheader">Tipo de residuo</th>
                    <th role="columnheader">Peso declarado</th>
                  </tr>
                </thead>
                <tbody id="cuerpo-esperado" role="rowgroup"></tbody>
              </table>
            </div>
          </section>
        </div>

        <section class="panel columna-lateral" id="panel-recepcion" aria-labelledby="titulo-recepcion">
          <h2 class="titulo-panel" id="titulo-recepcion">Recepción</h2>
          <div id="zona-recepcion"></div>
        </section>
      </div>

    </main>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/formularios.js"></script>
<script src="js/shell.js"></script>
<script src="js/tabla.js"></script>
<script src="js/incidencias-comun.js"></script>
<script src="js/recepcion-detalle.js"></script>
</body>
</html>
