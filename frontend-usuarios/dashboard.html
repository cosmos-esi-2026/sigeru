<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGeRU - Panel</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <span class="marca">SiGeRU</span>
    <div class="links">
      <a href="dashboard.html">Inicio</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="contenedores.html">Contenedores</a>
      <a href="camiones.html">Camiones</a>
      <a href="#" id="btn-salir">Cerrar sesion</a>
    </div>
  </nav>

  <div class="contenido">
    <div class="caja">
      <h2>Bienvenido/a <span id="nombre-usuario"></span></h2>
      <p>Rol: <strong id="rol-usuario"></strong></p>
      <p class="mt">Desde aca podes acceder a los modulos del sistema.</p>
    </div>

    <div class="grilla-tarjetas">
      <a class="tarjeta-link" href="usuarios.html">
        <h3>Usuarios</h3>
        <p>Listado y alta de usuarios</p>
      </a>
      <a class="tarjeta-link" href="contenedores.html">
        <h3>Contenedores</h3>
        <p>Listado y alta de contenedores</p>
      </a>
      <a class="tarjeta-link" href="camiones.html">
        <h3>Camiones</h3>
        <p>Listado y alta de camiones</p>
      </a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    Sesion.exigir();

    const usuario = Sesion.obtener();
    document.getElementById("nombre-usuario").textContent =
      usuario.nombre + " " + (usuario.apellido || "");
    document.getElementById("rol-usuario").textContent = usuario.rol || "Usuario";
  </script>
</body>
</html>
