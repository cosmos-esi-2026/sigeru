<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGeRU - Panel</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="layout">

  <!-- ===================== Barra lateral ===================== -->
  <aside class="sidebar" id="sidebar">

    <a class="sidebar-marca" href="dashboard.html">
      <img src="img/logo.svg" alt="">
      SiGeRU
    </a>

    <nav class="sidebar-nav">
      <a class="sidebar-link activo" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H4a1 1 0 0 1-1-1z"/>
        </svg>
        Inicio
      </a>
      <a class="sidebar-link" href="usuarios.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="3.2"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/>
          <path d="M16.5 5.3a3.2 3.2 0 0 1 0 5.4"/><path d="M17.8 14.4A6.2 6.2 0 0 1 21.2 20"/>
        </svg>
        Usuarios
      </a>
      <a class="sidebar-link" href="contenedores.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/>
          <path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
        Contenedores
      </a>
      <a class="sidebar-link" href="camiones.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 6h11v10H2z"/><path d="M13 9.5h4l4 3.5V16h-8z"/>
          <circle cx="7" cy="18.3" r="1.9"/><circle cx="17" cy="18.3" r="1.9"/>
        </svg>
        Camiones
      </a>
    </nav>

    <div class="sidebar-pie">
      <div class="sidebar-usuario">
        <div class="nombre" id="sidebar-nombre"></div>
        <div class="rol" id="sidebar-rol"></div>
      </div>
      <a class="sidebar-link" href="#" id="btn-salir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/>
          <path d="M10 8l-4 4 4 4"/><path d="M6 12h11"/>
        </svg>
        Cerrar sesion
      </a>
    </div>

  </aside>

  <!-- ===================== Contenido ===================== -->
  <div class="principal">

    <header class="topbar">
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <h1>Panel</h1>
    </header>

    <main class="contenido">

      <!-- Metricas -->
      <div class="metricas">
        <div class="metrica">
          <div class="metrica-etiqueta">Contenedores</div>
          <div class="metrica-valor" id="metrica-contenedores">-</div>
        </div>
        <div class="metrica">
          <div class="metrica-etiqueta">Contenedores llenos</div>
          <div class="metrica-valor rojo" id="metrica-llenos">-</div>
        </div>
        <div class="metrica">
          <div class="metrica-etiqueta">Camiones operativos</div>
          <div class="metrica-valor verde" id="metrica-camiones">-</div>
        </div>
        <div class="metrica">
          <div class="metrica-etiqueta">Usuarios registrados</div>
          <div class="metrica-valor" id="metrica-usuarios">-</div>
        </div>
      </div>

      <!-- Contenedores que requieren atencion -->
      <div class="panel">
        <div class="barra-herramientas">
          <span class="titulo">Contenedores llenos</span>
          <a class="btn-accion" href="contenedores.html">Ver todos</a>
        </div>
        <div class="tabla-scroll">
          <table class="tabla">
            <thead>
              <tr>
                <th>Codigo</th><th>Direccion</th><th>Capacidad</th><th>Estado</th>
              </tr>
            </thead>
            <tbody id="cuerpo-llenos">
              <tr><td colspan="4" class="fila-aviso"><p>Cargando...</p></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/tabla.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
