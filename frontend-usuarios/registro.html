<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGeRU - Registro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="pantalla-centrada">
    <div class="tarjeta-auth">
      <h1>SiGeRU</h1>
      <p class="subtitulo">Crear una cuenta</p>

      <form id="form-registro" class="formulario">
        <label>Nombre
          <input type="text" name="nombre" required>
        </label>
        <label>Apellido
          <input type="text" name="apellido" required>
        </label>
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Contrasena
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="boton boton-primario">Registrarme</button>
      </form>

      <p id="mensaje" class="mensaje"></p>

      <p class="texto-centro mt">
        Ya tenes cuenta? <a href="login.html">Inicia sesion</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
