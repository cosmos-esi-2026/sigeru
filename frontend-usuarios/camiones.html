<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGeRU - Camiones</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <span class="marca">SiGeRU</span>
    <div class="links">
      <a href="dashboard.html">Inicio</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="contenedores.html">Contenedores</a>
      <a href="camiones.html">Camiones</a>
      <a href="#" id="btn-salir">Cerrar sesion</a>
    </div>
  </nav>

  <div class="contenido">

    <div class="caja">
      <h2>Nuevo camion</h2>
      <form id="form-camion" class="formulario">
        <label>Matricula
          <input type="text" name="matricula" placeholder="SXX-0000" required>
        </label>
        <label>Marca
          <input type="text" name="marca">
        </label>
        <label>Modelo
          <input type="text" name="modelo">
        </label>
        <label>Capacidad (kg)
          <input type="number" name="capacidad" min="0">
        </label>
        <label>Estado
          <select name="estado">
            <option value="operativo">operativo</option>
            <option value="en_ruta">en_ruta</option>
            <option value="mantenimiento">mantenimiento</option>
            <option value="fuera_servicio">fuera_servicio</option>
          </select>
        </label>
        <button type="submit" class="boton boton-primario">Guardar</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </div>

    <div class="caja">
      <div class="fila-titulo">
        <h2>Camiones</h2>
        <button class="boton boton-primario boton-pequeno" id="btn-recargar">Recargar</button>
      </div>
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th><th>Matricula</th><th>Marca</th>
            <th>Modelo</th><th>Capacidad</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla">
          <tr><td colspan="6">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/camiones.js"></script>
</body>
</html>
