<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camiones - SiGeRU</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#115440">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tema.js"></script>
</head>
<body>

<a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>

<div class="layout">

  <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>

  <div class="principal">

    <header class="topbar">
      <div class="topbar-titulo">
        <h1>Camiones</h1>
        <p class="bajada">Flota de recolección: matrícula, capacidad y disponibilidad.</p>
      </div>
      <button class="boton boton-primario" id="btn-nuevo" data-bs-toggle="modal" data-bs-target="#modal-camion">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nuevo camión
      </button>
    </header>

    <main class="contenido" id="contenido-principal">
      <section class="panel" aria-labelledby="titulo-listado">

        <div class="barra-herramientas">
          <h2 class="titulo" id="titulo-listado">Listado</h2>

          <div class="buscador-caja">
            <label class="solo-lectores" for="buscador">Buscar camiones</label>
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="search" class="buscador" id="buscador"
                   placeholder="Matrícula, marca o estado">
          </div>

          <button class="boton boton-icono" id="btn-recargar" aria-label="Recargar el listado">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/>
            </svg>
          </button>
        </div>

        <p id="mensaje-pagina" class="mensaje" role="status" aria-live="polite"></p>
        <p class="contador-resultados" id="contador-resultados" data-sustantivo="camiones"></p>

        <div class="tabla-scroll">
          <table class="tabla" id="tabla-camiones" role="table">
            <thead role="rowgroup">
              <tr role="row">
                <th role="columnheader" data-orden>Matrícula</th>
                <th role="columnheader" data-orden>Marca</th>
                <th role="columnheader" data-orden>Modelo</th>
                <th role="columnheader" data-orden>Capacidad</th>
                <th role="columnheader" data-orden>Estado</th>
                <th role="columnheader"><span class="solo-lectores">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla" role="rowgroup">
              <tr class="fila-esqueleto" aria-hidden="true">
                <td><span class="esqueleto esqueleto-corto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto esqueleto-corto"></span></td>
              </tr>
            </tbody>
          </table>
        </div>

      </section>
    </main>
  </div>
</div>

<div class="modal fade" id="modal-camion" tabindex="-1" aria-labelledby="titulo-modal-camion" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title" id="titulo-modal-camion">Nuevo camión</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <form id="form-camion" class="formulario">
          <label>Matrícula
            <input type="text" name="matricula" placeholder="SXX-0000" required>
          </label>
          <div class="formulario-columnas">
            <label>Marca
              <input type="text" name="marca" placeholder="Mercedes-Benz">
            </label>
            <label>Modelo
              <input type="text" name="modelo" placeholder="Atego 1719">
            </label>
          </div>
          <div class="formulario-columnas">
            <label>Capacidad (kg)
              <input type="number" name="capacidad" min="0" placeholder="8000">
            </label>

            <label>Estado
              <select name="estado">
                <option value="operativo">Operativo</option>
                <option value="en_ruta">En ruta</option>
                <option value="mantenimiento">En mantenimiento</option>
                <option value="fuera_servicio">Fuera de servicio</option>
              </select>
            </label>
          </div>
          <button type="submit" class="boton boton-primario">Guardar camión</button>
        </form>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </div>

    </div>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/formularios.js"></script>
<script src="js/shell.js"></script>
<script src="js/tabla.js"></script>
<script src="js/camiones.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
