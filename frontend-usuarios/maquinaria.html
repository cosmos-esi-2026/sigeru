<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maquinaria - SiGeRU</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#115440">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>

<div class="layout">

  <aside class="sidebar" id="sidebar" aria-label="Menú principal"></aside>

  <div class="principal">

    <header class="topbar">
      <div class="topbar-titulo">
        <h1>Maquinaria</h1>
        <p class="bajada">El equipamiento fijo de cada centro de acopio: qué hay, dónde está y si funciona.</p>
      </div>
      <button class="boton boton-primario solo-admin" id="btn-nuevo" data-bs-toggle="modal" data-bs-target="#modal-maquinaria">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nueva máquina
      </button>
    </header>

    <main class="contenido" id="contenido-principal">
      <section class="panel" aria-labelledby="titulo-listado">

        <div class="barra-herramientas">
          <h2 class="titulo" id="titulo-listado">Listado</h2>

          <div class="buscador-caja">
            <label class="solo-lectores" for="buscador">Buscar maquinaria</label>
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="search" class="buscador" id="buscador"
                   placeholder="Buscar por código, tipo, marca o centro">
          </div>

          <button class="boton boton-icono" id="btn-recargar" aria-label="Recargar el listado">
            <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/>
            </svg>
          </button>
        </div>

        <p id="mensaje-pagina" class="mensaje" role="status" aria-live="polite"></p>
        <p class="contador-resultados" id="contador-resultados" data-sustantivo="máquinas"></p>

        <div class="tabla-scroll">
          <table class="tabla" id="tabla-maquinaria" role="table">
            <thead role="rowgroup">
              <tr role="row">
                <th role="columnheader" data-orden>Código</th>
                <th role="columnheader" data-orden>Tipo</th>
                <th role="columnheader" data-orden>Marca y modelo</th>
                <th role="columnheader" data-orden>Centro de acopio</th>
                <th role="columnheader" data-orden>Estado</th>
                <th role="columnheader" class="solo-admin"><span class="solo-lectores">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla" role="rowgroup">
              <tr class="fila-esqueleto" aria-hidden="true">
                <td><span class="esqueleto esqueleto-corto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto"></span></td>
                <td><span class="esqueleto esqueleto-corto"></span></td>
              </tr>
            </tbody>
          </table>
        </div>

      </section>
    </main>
  </div>
</div>

<div class="modal fade" id="modal-maquinaria" tabindex="-1" aria-labelledby="titulo-modal-maquinaria" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title" id="titulo-modal-maquinaria">Nueva máquina</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <form id="form-maquinaria" class="formulario">
          <div class="formulario-columnas">
            <label>Código
              <input type="text" name="codigo" placeholder="MAQ-007" required>
            </label>
            <label>Tipo
              <select name="tipo">
                <option value="compactadora">Compactadora</option>
                <option value="pala_cargadora">Pala cargadora</option>
                <option value="cinta_clasificadora">Cinta de clasificación</option>
                <option value="retroexcavadora">Retroexcavadora</option>
                <option value="montacargas">Montacargas</option>
                <option value="otra">Otra</option>
              </select>
            </label>
          </div>
          <div class="formulario-columnas">
            <label>Marca
              <input type="text" name="marca" placeholder="Caterpillar">
            </label>
            <label>Modelo
              <input type="text" name="modelo" placeholder="950 GC">
            </label>
          </div>

          <label>Centro de acopio
            <select name="id_centro" required></select>
          </label>
          <label>Estado
            <select name="estado">
              <option value="operativa">Operativa</option>
              <option value="mantenimiento">En mantenimiento</option>
              <option value="fuera_servicio">Fuera de servicio</option>
            </select>
          </label>
          <button type="submit" class="boton boton-primario">Guardar máquina</button>
        </form>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </div>

    </div>
  </div>
</div>

<div class="modal fade" id="modal-estado" tabindex="-1" aria-labelledby="titulo-modal-estado" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="titulo-modal-estado">Cambiar el estado</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="form-estado" class="formulario" novalidate>
          <p class="ayuda" id="texto-estado"></p>
          <label>Nuevo estado
            <select name="estado" required>
              <option value="operativa">Operativa</option>
              <option value="mantenimiento">En mantenimiento</option>
              <option value="fuera_servicio">Fuera de servicio</option>
            </select>
          </label>
          <label>Nota
            <textarea name="observacion" rows="2" required maxlength="300" placeholder="Qué se hizo o por qué cambia: por ejemplo, cambio de correa"></textarea>
          </label>
          <button type="submit" class="boton boton-primario">Guardar el cambio</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modal-historial" tabindex="-1" aria-labelledby="titulo-modal-historial" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="titulo-modal-historial">Historial de la máquina</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="zona-historial" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/formularios.js"></script>
<script src="js/shell.js"></script>
<script src="js/tabla.js"></script>
<script src="js/maquinaria.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
