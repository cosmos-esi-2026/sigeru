# /etc/ssh/sshd_config.d/sigeru.conf - endurecimiento SSH del servidor sigeru-srv
#
# Se deja como archivo aparte en sshd_config.d/ (en vez de editar sshd_config a mano) para
# que quede versionado en el repo tal cual se aplica, y porque Ubuntu Server moderno ya
# incluye "Include /etc/ssh/sshd_config.d/*.conf" al final de sshd_config por defecto: alcanza
# con copiar este archivo, sin tocar el original. Ver administracion-sistemas-operativos/ssh.md.

# Es la primera cuenta que prueba cualquier robot que escanea internet: se sabe que existe
# y tiene todos los permisos. Con "no", para administrar hay que entrar como sigeru y sudo,
# que ademas deja registrado quien hizo que.
PermitRootLogin no

# Arranca en "yes" hasta que las claves de los cuatro integrantes esten cargadas en
# ~cosmos2026/.ssh/authorized_keys (con ssh-copy-id desde cada PC); se pasa a "no" recien
# entonces, documentado como el paso siguiente en ssh.md.
PasswordAuthentication yes

# Corta los intentos de adivinar contrasena.
MaxAuthTries 3

# Solo esa cuenta entra por SSH, aunque se creen otras despues (ej. con sigeru-admin
# usuarios alta). Se decidio en la instalacion del 13/09 usar "cosmos2026" en vez de
# "sigeru" como cuenta del sistema operativo (el plan original decia "sigeru"); no afecta
# a la base de datos ni a /opt/sigeru, que siguen llamandose asi.
AllowUsers cosmos2026

# No hay entorno grafico: menos superficie de ataque.
X11Forwarding no
