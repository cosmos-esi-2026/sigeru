# /etc/netplan/01-sigeru.yaml - IP fija del servidor SiGeRU (sigeru-srv)
#
# La VM corre en modo NAT de VirtualBox (ver plan-de-instalacion.md, seccion 3): la red
# puente quedo descartada porque esta PC esta en el dominio Ceibal y una interfaz en modo
# puente/promiscuo puede estar bloqueada por politica de red del laboratorio. Es la
# contingencia que el propio plan ya preveia ("si la red puente no funciona... alcanza con
# NAT: la VM sale a internet y la PC anfitriona la ve, aunque el resto de la red no").
#
# Dentro de esa red NAT (10.0.2.0/24, la crea VirtualBox) la IP SI se fija de forma
# estatica en vez de dejarla en DHCP: 10.0.2.2 es siempre el gateway (la PC anfitriona) y
# 10.0.2.3 el servidor DNS que arma VirtualBox.
network:
  version: 2
  ethernets:
    enp0s3:                      # nombre que muestra "ip -brief address" en VirtualBox/IDE
      dhcp4: false
      addresses:
        - 10.0.2.15/24
      routes:
        - to: default
          via: 10.0.2.2
      nameservers:
        addresses: [10.0.2.3, 1.1.1.1]
