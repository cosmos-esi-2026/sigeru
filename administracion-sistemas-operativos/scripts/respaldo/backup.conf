# ============================================================================
#  SiGeRU 2026 - Configuracion del respaldo (la leen backup.sh y restaurar.sh)
#
#  Este archivo vive AL LADO de backup.sh. Al instalar con instalar.sh queda en
#  /opt/sigeru/respaldo/backup.conf con permisos 640 (root), porque guarda la
#  contrasena de la base.
#
#  Cada valor se puede pisar sin editar el archivo, con una variable de entorno
#  del mismo nombre y el prefijo SIGERU_. Por ejemplo, para respaldar la base
#  del Docker del proyecto desde otra maquina:
#
#      SIGERU_DB_HOST=sigeru-db SIGERU_DB_CLAVE=root ./backup.sh
#
#  Las cinco variables de la base usan los MISMOS nombres que lee
#  config/database.php de las APIs (SIGERU_DB_HOST, _PORT, _NAME, _USER, _PASS),
#  asi que en el docker-compose.yml ya estan definidas y no hay que repetirlas.
# ============================================================================

# --- Base de datos ----------------------------------------------------------
# Valores por defecto: MySQL local, como lo deja el manual de instalacion.
DB_HOST=127.0.0.1
DB_PUERTO=3306
DB_NOMBRE=sigeru
DB_USUARIO=root
DB_CLAVE=

# --- Que se respalda ademas de la base ---------------------------------------
# Carpeta del codigo del sistema en el servidor (las dos APIs y los frontends).
RUTA_CODIGO=/var/www/sigeru

# Archivos de configuracion del servidor que conviene tener a mano si hay que
# reinstalar. Se incluyen solo los que existan; los que falten se anotan en el
# log y no cortan el respaldo.
RUTAS_CONFIG="/etc/apache2/sites-available /etc/mysql/mysql.conf.d /etc/netplan /etc/ssh/sshd_config /etc/cron.d/sigeru-backup /opt/sigeru/respaldo/backup.conf"

# --- Donde y cuanto tiempo --------------------------------------------------
# Carpeta donde quedan los .tar.gz. En el servidor real es un disco aparte
# montado en /backups (ver respaldo-y-alta-disponibilidad.md).
DIR_RESPALDOS=/backups

# Los respaldos diarios de mas de esta cantidad de dias se borran solos.
# Los semanales y mensuales no viven aca: se copian a otro medio (politica 3-2-1).
DIAS_RETENCION=14

# Log con fecha y hora de cada paso.
ARCHIVO_LOG=/var/log/sigeru-backup.log
