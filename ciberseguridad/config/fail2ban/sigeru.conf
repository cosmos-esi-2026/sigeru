# SiGeRU - configuracion propia del jail de sshd (2da entrega, Ciberseguridad)
#
# Copiar a /etc/fail2ban/jail.d/sigeru.conf y recargar con
# "sudo fail2ban-client reload".
#
# 10.0.2.2 es el gateway NAT de VirtualBox = la PC anfitriona que administra el
# servidor por SSH (ver administracion-sistemas-operativos/red-estatica.md).
# Se excluye a proposito de los baneos para que el equipo nunca se banee a si
# mismo por errores de tipeo en la contrasena durante la administracion
# remota. El jail sigue activo y baneando a cualquier otro origen.
[DEFAULT]
ignoreip = 127.0.0.1/8 ::1 10.0.2.2

[sshd]
enabled  = true
maxretry = 3
findtime = 10m
bantime  = 1h
